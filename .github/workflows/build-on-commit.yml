name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  Clone-Celeritas:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone Celeritas
        run: git clone --single-branch --branch stonecutter https://git.taumc.org/embeddedt/celeritas.git

      - name: Cache Celeritas Repository
        uses: actions/cache@v3
        with:
          path: ./celeritas
          key: celeritas-repository-in-${{ github.sha }}
  Build-21-1:
    needs: Clone-Celeritas
    runs-on: ubuntu-24.04
    steps:
      - name: Restore Celeritas Repository Cache
        uses: actions/cache@v3
        with:
          path: ./celeritas
          key: celeritas-repository-in-${{ github.sha }}

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21
         
      - name: Build
        run: |
          cd celeritas
          chmod +x ./gradlew
          ./gradlew -Ptarget_versions=1.21.1 packageJar --parallel

      - name: Upload to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: celeritas-1.21.1-builds
          path: "./celeritas/build/libs/*-dev/*"

