name: Build on tag

on:
  workflow_dispatch:
    inputs:
      build_1_21_1:
        description: 'Build 1.21.1'
        type: boolean
        default: false
      build_1_20_1:
        description: 'Build 1.20.1'
        type: boolean
        default: false
      build_1_18_2:
        description: 'Build 1.18.2'
        type: boolean
        default: false
      build_1_16_5:
        description: 'Build 1.16.5'
        type: boolean
        default: false
      build_1_12_2:
        description: 'Build 1.12.2'
        type: boolean
        default: true
#      build_1_8_9:
#        description: 'Build 1.8.9'
#        type: boolean
#        default: false
      build_1_7_10:
        description: 'Build 1.7.10'
        type: boolean
        default: false
      build_1_2_5:
        description: 'Build 1.2.5'
        type: boolean
        default: false
      build_beta_versions:
        description: 'Build Beta Versions'
        type: boolean
        default: false
  schedule:
    - cron: '0 0 1 * *' 

jobs:
  Clone-Celeritas:
    runs-on: ubuntu-24.04
    steps:          
      - name: Clone Celeritas
        run: git clone --single-branch --branch stonecutter https://git.taumc.org/embeddedt/celeritas.git

      - name: Reset to latest tag
        run: |
          cd celeritas
          latest_tag=$(git tag --sort=-creatordate | head -n 1)
          git reset --hard "$latest_tag"


      - name: Cache Celeritas Repository
        uses: actions/cache@v3
        with:
          path: ./celeritas
          key: celeritas-repository-ontag-in-${{ github.run_id }}
  Build-21-1:
    needs: Clone-Celeritas
    if: ${{ github.event.inputs.build_1_21_1 == 'true' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Restore Celeritas Repository Cache
        uses: actions/cache@v3
        with:
          path: ./celeritas
          key: celeritas-repository-ontag-in-${{ github.run_id }}

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21
         
      - name: Build
        run: |
          cd celeritas
          chmod +x ./gradlew
          ./gradlew -Ptarget_versions=1.21.1 packageJar --parallel

      - name: Remove other versions
        continue-on-error: true
        run: find ./celeritas/build/libs/*-dev/ -type f ! -name "*21.1*.jar" -delete

      - name: Upload to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: celeritas-1.21.1-builds
          path: "./celeritas/build/libs/*-dev/*"

      - name: Upload to Releases
        uses: marvinpinto/action-automatic-releases@latest
        with:
          title: Celeritas Build 1.21.1 on tag
          automatic_release_tag: "celeritas-build-1.21.1-on-tag"
          repo_token: "${{ secrets.UPLOAD_TO_RELEASE }}"
          files: "./celeritas/build/libs/*-dev/*"
          prerelease: true

